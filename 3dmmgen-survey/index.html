<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3DMMGEN-RF Virtual Patient Survey - Coming Soon">
    <title>3DMMGEN Survey</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #ffffff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .coming-soon-text {
            font-size: 1.3rem;
            color: #999;
            font-weight: 500;
            margin-top: 40px;
        }

        .footer {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #999;
        }

        a {
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #333;
            transition: opacity 0.3s;
        }

        a:hover {
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>3DMMGEN Survey</h1>
        <p>Distinguishing synthetic and real patient imagery</p>
        
        <div class="coming-soon-text">
            Coming Soon
        </div>

        <div class="footer">
            <p>
                <a href="https://github.com/ttlmh/3dmmgen-rf" target="_blank">GitHub</a>
            </p>
        </div>
    </div>
</body>
</html>
